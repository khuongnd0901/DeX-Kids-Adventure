name: P0 Android emulator E2E and GL A/B
on:
  pull_request:
    branches: ["feat/T-008-T-009-single-display-controls"]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare deterministic art tooling
        run: python3 -m pip install --disable-pip-version-check cairosvg==2.8.2 Pillow==12.3.0
      - name: Enable /dev/kvm for GitHub emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Build emulator app/test APK and core tests
        run: gradle --no-daemon :core:test :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Run actual Android framework and GL instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/ci/p0-emulator-e2e.sh
      - name: Upload P0 emulator logs/screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-t012-android-evidence
          if-no-files-found: warn
          path: build/p0-emulator-evidence/
