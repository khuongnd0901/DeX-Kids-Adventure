name: One-time merged branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete-confirmed-merged-branches:
    if: ${{ github.repository == 'khuongnd0901/DeX-Kids-Adventure' && github.event.head_commit.message == 'chore: one-time merged branch cleanup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm main includes every source branch commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_REPOSITORY" == "khuongnd0901/DeX-Kids-Adventure" ]]
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in \
            "feat/T-001-bootstrap-libgdx" \
            "feat/T-008-T-009-single-display-controls" \
            "feat/T-012-android-integration-performance"; do
            git show-ref --verify --quiet "refs/remotes/origin/$branch"
            git merge-base --is-ancestor "refs/remotes/origin/$branch" HEAD || {
              echo "::error::Branch $branch is not merged into main: refusing deletion"
              exit 1
            }
            echo "Confirmed merged: $branch"
          done
      - name: Delete only the three confirmed merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "feat/T-012-android-integration-performance" \
            "feat/T-008-T-009-single-display-controls" \
            "feat/T-001-bootstrap-libgdx"; do
            echo "Deleting merged branch $branch"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
          done
          echo "Deleted all 3 feature branches; main retained."
