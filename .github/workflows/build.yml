name: Android and desktop build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "feat/T-001-bootstrap-libgdx"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic art build tooling
        run: python3 -m pip install --disable-pip-version-check cairosvg==2.8.2 Pillow==12.3.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK 35
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify reviewed OSM pack and license ledger
        run: python3 tools/validate_reviewed_pois.py
      - name: Validate sourced HCMC preview POIs and cue catalog
        run: python3 tools/test_hcm_sample.py
      - name: Verify safe OSM offline conversion
        run: python3 tools/test_osm_pipeline.py
      - name: Validate single-display control contract
        run: python3 tools/test_single_display_contract.py
      - name: Build and unit tests
        run: gradle --no-daemon :core:test :desktop:classes :android:assembleDebug :android:assembleDebugAndroidTest
      - name: Validate Capybara face landmarks
        run: python3 tools/test_capybara_face.py
      - name: Verify sprite regions and alpha
        run: python3 tools/test_sprite_atlas.py
      - name: Render all cast sprites to visual review sheet
        run: python3 tools/make_cast_sheet.py
      - name: Desktop OpenGL visual smoke (synthetic journey)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri
          mkdir -p build/visual-evidence
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle --no-daemon :desktop:run --args="--smoke-frames 120 --width 1280 --height 720 --screenshot build/visual-evidence/kids-1280x720.png"
          xvfb-run -a -s "-screen 0 1920x1080x24" gradle --no-daemon :desktop:run --args="--gpx test-data/gps/synthetic-urban-short.gpx --smoke-frames 120 --width 1920 --height 1080 --screenshot build/visual-evidence/kids-1920x1080.png"
          test -s build/visual-evidence/kids-1280x720.png
          test -s build/visual-evidence/kids-1920x1080.png
          # Illustrative POI look: use only explicit source-checked preview pack
          # and deterministic synthetic HCMC GPX replay, not real street routing.
          xvfb-run -a -s " -screen 0 1920x1080x24" gradle --no-daemon :desktop:run --args="--gpx test-data/gps/synthetic-hcm-poi-loop.gpx --sample-preview true --start-seconds 170 --smoke-frames 150 --width 1920 --height 1080 --screenshot build/visual-evidence/m6-hcm-preview-1920x1080.png"
          test -s build/visual-evidence/m6-hcm-preview-1920x1080.png
          python3 tools/make_preview_gif.py
          test -s build/visual-evidence/capybara-bus-animation-preview.gif
      - name: Upload desktop screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex-kids-opengl-screenshots
          path: build/visual-evidence/
      - name: Upload generated sprite atlas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex-kids-sprite-artifacts
          path: assets/generated/
      - name: Upload debug artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex-kids-debug-apk
          path: android/build/outputs/apk/debug/*.apk
