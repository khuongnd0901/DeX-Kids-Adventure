
name: Android and desktop build
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and unit tests
        run: gradle --no-daemon :core:test :desktop:classes :android:assembleDebug
      - name: Upload debug artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dex-kids-debug-apk
          path: android/build/outputs/apk/debug/*.apk
